[project]
name = "dagster-fme"
version = "0.1.0"
description = "Dagster Component that represents FME Flow workspaces as assets and observes FME jobs via a sensor."
readme = "README.md"
authors = [
    { name = "Cody Scott", email = "13374836+cody-scott@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.11",
    "httpx>=0.27",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Dagster",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.entry-points."dagster_dg_cli.registry_modules"]
dagster_fme = "dagster_fme"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["fme"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.coverage.run]
source = ["dagster_fme"]
branch = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]
