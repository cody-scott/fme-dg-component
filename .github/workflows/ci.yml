name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --cov=dagster_fme --cov-report=term-missing

  lowest-direct:
    name: lowest-direct deps (py3.10)
    runs-on: ubuntu-latest
    env:
      # Must be set for every uv command; otherwise `uv run` re-syncs to the locked (highest) versions.
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync
      - run: uv run python -c "import dagster, httpx; print(dagster.__version__, httpx.__version__)"
      - run: uv run pytest
